# Render 蓝图 —— 一键部署「基金复诊台」到公网
#
# 用法(详细步骤见 00_交作业\部署到公网_怎么做.md):
#   1. 把这个目录推到一个 GitHub 仓库(public 或 private 都行)
#   2. 打开 https://dashboard.render.com → New → Blueprint → 选那个仓库
#   3. Render 读到本文件, 自动建服务; 建完给你一个 https://xxxx.onrender.com 的地址
#
# 默认走 Docker(见 Dockerfile) —— 因为要装 poppler-utils 给官方 PDF 对账用。
# 免费档会在一段时间没人访问后休眠, 下次访问冷启动约 30 秒, 之后正常。

services:
  - type: web
    name: fundclinic
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FUNDCLINIC_CLOUD
        value: "1"
      - key: NODE_ENV
        value: production

      # ---- 用量闸门(2026-10-10 加) ----
      # 本形态是"服务端持有你的 Key, 访客只输代码", 所以 Key 就是**任何点开链接的人都能花的钱**。
      # 这三道闸在云端会自动启用(本地跑不受影响), 想改额度就改这里的数值后重新部署。
      - key: FUNDCLINIC_MAX_RUNS_DAY      # 全站每天上限 —— 真正兜住账单的那一道
        value: "40"
      - key: FUNDCLINIC_MAX_PER_IP_HOUR   # 同一台机器每小时
        value: "3"
      - key: FUNDCLINIC_MAX_PER_IP_DAY    # 同一台机器每天
        value: "8"

      # ---- 你的 API Key ----
      # ⚠️ 必须写在这个文件里(而不是只在面板上手填), 否则**每次重新部署都可能被蓝图覆盖掉**。
      #    sync: false 的意思正是: "值不要从仓库同步, 我在面板里填" —— 填一次就长期有效。
      #    仓库里永远不出现 Key 本身。
      - key: FUNDCLINIC_LLM_KEY
        sync: false
      # 可选: 换模型/换服务商(any OpenAI 兼容接口)。不填就用内置默认(DeepSeek)。
      # - key: FUNDCLINIC_LLM_MODEL
      #   sync: false
      # - key: FUNDCLINIC_LLM_BASE
      #   sync: false
